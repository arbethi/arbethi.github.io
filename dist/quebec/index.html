<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Québec — Destinations</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FFFFFF;
    --sidebar-bg: #F2F2F2;
    --border: #DCDCDC;
    --text: #111111;
    --text-muted: #888888;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    background: var(--bg);
    padding: 0.75rem 2rem;
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    border-bottom: 2px solid var(--text);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 1.2rem;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }
  

  header a {
    color: var(--text-muted);
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s;
  }

  header a:hover { color: var(--text); border-bottom-color: var(--text); }

  header a.active {
    color: var(--text);
    font-weight: 700;
    border-bottom: 2px solid var(--text);
  }

  .layout {
    display: flex;
    height: calc(100vh - 58px);
  }

  /* ── MAP ── */
  #map {
    flex: 1 1 0;
    min-width: 0;
    z-index: 1;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 820px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-left: 1px solid var(--border);
    overflow: hidden;
    padding: 1rem;
    display: flex;
    flex-direction: column;
  }

  #sidebar-cards {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 1fr;
    gap: 8px;
    min-height: 0;
  }

  .dest-card {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
    text-decoration: none;
  }

  .dest-card:hover, .dest-card.active {
    border-color: var(--text);
    transform: translateY(-1px);
  }

  .dest-img-wrap {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #000;
  }

  .dest-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .dest-img-wrap .img-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F7F7F7;
    border-bottom: 1px dashed var(--border);
  }

  .dest-img-wrap .img-placeholder svg {
    opacity: 0.3;
  }

  .dest-num {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 22px;
    height: 22px;
    border-radius: 3px;
    background: var(--text);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .dest-info {
    padding: 7px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-top: 1px solid var(--border);
  }

  .dest-info strong {
    color: var(--text);
    font-size: 13px;
    font-weight: 900;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dest-info small {
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 400;
  }

  /* Leaflet popup styling */
  .leaflet-popup-content-wrapper {
    border-radius: 6px !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12) !important;
    background: var(--bg) !important;
    border: 1px solid var(--border) !important;
    padding: 0 !important;
    overflow: hidden;
  }

  .leaflet-popup-tip {
    background: var(--bg) !important;
  }

  .leaflet-popup-close-button {
    color: var(--text) !important;
    font-size: 16px !important;
    top: 8px !important;
    right: 8px !important;
  }

  .popup-inner {
    padding: 12px 14px;
    min-width: 200px;
  }

  .popup-num {
    display: inline-flex;
    width: 22px;
    height: 22px;
    border-radius: 3px;
    background: var(--text);
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .popup-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 3px;
  }

  .popup-sub {
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .popup-img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    display: block;
    margin-bottom: 0;
  }

  /* scrollbar for sidebar */
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <a href="../index.html" style="font-size: 1.5rem; color:black">←</a>
  <h1>Québec</h1>
  <a href="index.html" class="active">Carte</a>
  <a href="tips.html" >Tips</a>
  <a href="expressions.html">Expressions</a>
</header>

<div class="layout">
  <div id="map"></div>

  <aside class="sidebar">
    <div id="sidebar-cards"></div>
  </aside>
</div>

<script>
const destinations = [
  {
    id: 1,
    name: "Québec ville",
    sub: "Capitale historique",
    lat: 46.8139,
    lng: -71.2080,
    img: "images/1.jpg"
  },
  {
    id: 2,
    name: "Montréal",
    sub: "Métropole culturelle",
    lat: 45.5017,
    lng: -73.5673,
    img: "images/2.jpg"
  },
  {
    id: 3,
    name: "Parc de la Chute-Montmorency",
    sub: "Chute & sentiers",
    lat: 46.8901,
    lng: -71.1508,
    img: "images/3.jpg"
  },
  {
    id: 4,
    name: "Parc national du Fjord-du-Saguenay",
    sub: "Fjord & baleines",
    lat: 48.2640,
    lng: -70.0770,
    img: "images/4.jpg"
  },
  {
    id: 5,
    name: "Parc national de la Mauricie",
    sub: "Lacs & forêt boréale",
    lat: 46.7900,
    lng: -73.0000,
    img: "images/5.jpg"
  },
  {
    id: 6,
    name: "Péninsule de la Gaspésie",
    sub: "Mer & montagnes",
    lat: 48.8358,
    lng: -64.4838,
    img: "images/6.jpg"
  },
  {
    id: 7,
    name: "Parc national du Mont-Tremblant",
    sub: "Plein air 4 saisons",
    lat: 46.4915,
    lng: -74.5860,
    img: "images/7.jpg"
  },
  {
    id: 8,
    name: "Parc Oméga",
    sub: "Faune canadienne",
    lat: 45.9261,
    lng: -75.0060,
    img: "images/8.jpg"
  }
];

// ── Map init ──
const map = L.map('map', {
  center: [47.0, -69.8],
  zoom: 7,
  zoomControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const markers = {};

function imgOrPlaceholder(src) {
  return `<img src="${src}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" style="width:100%;height:100%;object-fit:contain;display:block;">
  <div class="img-placeholder" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8952A" stroke-width="1.5">
      <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </div>`;
}

// ── Sidebar cards ──
const cardsContainer = document.getElementById('sidebar-cards');

destinations.forEach(d => {
  const card = document.createElement('div');
  card.className = 'dest-card';
  card.id = `card-${d.id}`;
  card.innerHTML = `
    <div class="dest-img-wrap" style="position:relative;">
      ${imgOrPlaceholder(d.img)}
      <span class="dest-num">${d.id}</span>
    </div>
    <div class="dest-info">
      <strong>${d.name}</strong>
      <small>${d.sub}</small>
    </div>
  `;
  card.addEventListener('click', () => {
    map.flyTo([d.lat, d.lng], 10, { duration: 1.2 });
    markers[d.id].openPopup();
    document.querySelectorAll('.dest-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
  });
  cardsContainer.appendChild(card);
});

// ── Markers ──
destinations.forEach((d, i) => {
  const iconHtml = `
    <div style="
      width:30px;height:30px;
      border-radius:4px;
      background:#111;
      border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 2px 6px rgba(0,0,0,0.25);
    ">
      <span style="color:#fff;font-weight:700;font-size:12px;font-family:'DM Sans',sans-serif;">${d.id}</span>
    </div>`;

  const icon = L.divIcon({
    html: iconHtml,
    className: '',
    iconSize: [34, 34],
    iconAnchor: [17, 34],
    popupAnchor: [0, -36]
  });

  const popupContent = `
    <img src="${d.img}" class="popup-img"
      onerror="this.style.display='none'"
      alt="${d.name}">
    <div class="popup-inner">
      <span class="popup-num">${d.id}</span>
      <div class="popup-title">${d.name}</div>
      <div class="popup-sub">${d.sub}</div>
    </div>`;

  const marker = L.marker([d.lat, d.lng], { icon })
    .addTo(map)
    .bindPopup(popupContent, { maxWidth: 240, minWidth: 200 });

  marker.on('click', () => {
    document.querySelectorAll('.dest-card').forEach(c => c.classList.remove('active'));
    document.getElementById(`card-${d.id}`).classList.add('active');
    document.getElementById(`card-${d.id}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  markers[d.id] = marker;
});

// ── Aéroport de Québec (YQB) ──
const airportIcon = L.divIcon({
  html: `<div style="
    width:34px;height:34px;
    border-radius:50%;
    background:#fff;
    border:2px solid #111;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    font-size:18px;line-height:1;
  ">✈️</div>`,
  className: '',
  iconSize: [34, 34],
  iconAnchor: [17, 17],
  popupAnchor: [0, -20]
});

L.marker([46.7911, -71.3933], { icon: airportIcon })
  .addTo(map)
  .bindPopup(`
    <div class="popup-inner">
      <div class="popup-title">Aéroport Jean-Lesage</div>
      <div class="popup-sub">Québec City — YQB</div>
    </div>`, { maxWidth: 200, minWidth: 160 });
</script>
</body>
</html>
